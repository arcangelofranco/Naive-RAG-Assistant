services:
    db:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: naive_rag_assistant
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

    api:
        build: .
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/naive_rag_assistant
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy

volumes:
    db-data:
